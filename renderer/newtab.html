<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src https://www.google.com data:; connect-src 'none'">
  <title>New Tab</title>
  <link rel="stylesheet" href="vendor/lucide/lucide.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <form class="search" id="searchForm" role="search">
    <i class="icon-search" aria-hidden="true"></i>
    <input id="searchInput" type="text" aria-label="Search or enter an address" autocomplete="off" spellcheck="false">
  </form>
  <div class="grid" id="grid"></div>
  <div class="dashboard">
    <div class="dash-main">
    </div>
    <aside class="dash-side">
      <section class="panel" id="bookmarksPanel">
        <h3>Bookmarks</h3>
        <div id="bookmarksList"></div>
      </section>
      <section class="panel" id="quickSettingsPanel">
        <h3>Quick settings</h3>
        <div class="qs-row">
          <span>Theme</span>
          <div class="qs-theme-toggle" id="themeToggleGroup">
            <button data-scheme="system">System</button>
            <button data-scheme="light">Light</button>
            <button data-scheme="dark">Dark</button>
          </div>
        </div>
        <div class="qs-row">
          <span>Redact sensitive headers</span>
          <input type="checkbox" id="redactToggle" />
        </div>
        <div class="qs-row">
          <span>Version</span>
          <span id="qsVersion">—</span>
        </div>
        <div id="qsUpdateStatus"></div>
      </section>
    </aside>
  </div>

  <!-- Background settings -->
  <button id="bgSettingsBtn" title="Customize background" aria-label="Customize background">&#9881;</button>
  <div id="bgPanel">
    <h3>Background</h3>
    <div class="bg-presets" id="bgPresets"></div>
    <div class="bg-custom-row">
      <label>Custom</label>
      <input type="text" id="bgColorInput" placeholder="#1a1a1a or CSS" maxlength="80">
    </div>
    <button id="bgApplyBtn">Apply</button>
  </div>

  <!-- Add site modal (hidden by default) -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" id="modalBox">
      <h2>Add site</h2>
      <label>URL</label>
      <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <label>Name</label>
      <input type="text" id="inputTitle" placeholder="Example" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancel</button>
        <button class="btn btn-primary" id="btnAdd">Add</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
