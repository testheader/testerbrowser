<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://www.google.com data:; connect-src 'none'">
  <title>New Tab</title>
  <style>
    /* Mirrors the app shell's tokens so this page follows the same theme
       toggle; the shell pushes changes over IPC (see the script below). */
    :root {
      --bg-primary: #1a1a1a; --bg-secondary: #252526; --bg-hover: #2e2e2e;
      --bg-tertiary: #333333; --border-color: #3a3a3a;
      --text-strong: #ffffff; --text-primary: #dddddd; --text-secondary: #aaaaaa;
      --text-muted: #888888; --text-faint: #666666;
      --accent: #4fc3f7; --accent-soft: #81d4fa; --error-strong: #c0392b;
      --on-fill: #000000;
    }
    body.light-mode {
      --bg-primary: #f7f7f7; --bg-secondary: #ededed; --bg-hover: #e4e4e4;
      --bg-tertiary: #dcdcdc; --border-color: #cccccc;
      --text-strong: #000000; --text-primary: #1a1a1a; --text-secondary: #333333;
      --text-muted: #5c5c5c; --text-faint: #7a7a7a;
      --accent: #0b7fc0; --accent-soft: #0369a1; --error-strong: #b52020;
      --on-fill: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 32px 48px;
      user-select: none;
      -webkit-user-select: none;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 48px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 720px;
    }

    @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }

    /* ── Tile ── */
    .tile {
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 130px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px 14px;
      transition: background 0.12s, box-shadow 0.12s, transform 0.1s, border-color 0.12s;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
    }
    .tile:hover {
      background: var(--bg-hover);
      border-color: var(--border-color);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      transform: translateY(-3px);
    }

    .tile-favicon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tile-initial {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-faint);
      flex-shrink: 0;
    }

    .tile-title {
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      line-height: 1.2;
    }
    .tile:hover .tile-title { color: var(--text-muted); }

    /* Remove button */
    .tile-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s, background 0.1s, color 0.1s;
      padding: 0;
    }
    .tile:hover .tile-remove { opacity: 1; }
    .tile-remove:hover { background: var(--error-strong); color: var(--text-strong); }

    /* ── Add tile ── */
    .tile-add {
      border-style: dashed;
      border-color: var(--border-color);
      background: transparent;
    }
    .tile-add:hover {
      border-color: var(--accent);
      background: rgba(79,195,247,0.04);
      box-shadow: none;
      transform: none;
    }
    .tile-add-icon {
      font-size: 26px;
      color: var(--text-faint);
      line-height: 1;
      transition: color 0.12s;
    }
    .tile-add:hover .tile-add-icon { color: var(--accent); }
    .tile-add .tile-title { color: var(--text-faint); }
    .tile-add:hover .tile-title { color: var(--accent); }

    /* ── Background settings button ── */
    #bgSettingsBtn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-faint);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
      z-index: 40;
    }
    #bgSettingsBtn:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ── Background settings panel ── */
    #bgPanel {
      position: fixed;
      bottom: 64px;
      right: 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      width: 220px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      display: none;
      z-index: 40;
    }
    #bgPanel h3 { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;
                  letter-spacing: 0.6px; margin: 0 0 12px; }
    .bg-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .bg-preset { width: 36px; height: 36px; border-radius: 6px; border: 2px solid transparent;
                 cursor: pointer; transition: border-color 0.1s; }
    .bg-preset:hover, .bg-preset.active { border-color: var(--accent); }
    .bg-custom-row { display: flex; align-items: center; gap: 8px; }
    .bg-custom-row label { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
    #bgColorInput { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px;
                    color: var(--text-primary); font-size: 12px; padding: 4px 6px; font-family: inherit; }
    #bgColorInput:focus { outline: none; border-color: var(--accent); }
    #bgApplyBtn { padding: 5px 12px; background: var(--accent); color: var(--on-fill); border: none;
                  border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit;
                  font-weight: 500; margin-top: 10px; width: 100%; }
    #bgApplyBtn:hover { background: var(--accent-soft); }

    /* ── Add modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px 30px 24px;
      width: 360px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .modal h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;
    }
    .modal label {
      display: block;
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .modal input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 14px;
      transition: border-color 0.12s;
    }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .btn {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.1s;
    }
    .btn-primary { background: var(--accent); color: var(--on-fill); font-weight: 500; }
    .btn-primary:hover { background: var(--accent-soft); }
    .btn-secondary { background: var(--bg-hover); color: var(--text-secondary); }
    .btn-secondary:hover { background: var(--bg-tertiary); }
  </style>
</head>
<body>
  <div class="wordmark">TesterBrowser</div>
  <div class="grid" id="grid"></div>

  <!-- Background settings -->
  <button id="bgSettingsBtn" title="Customize background">&#9881;</button>
  <div id="bgPanel">
    <h3>Background</h3>
    <div class="bg-presets" id="bgPresets"></div>
    <div class="bg-custom-row">
      <label>Custom</label>
      <input type="text" id="bgColorInput" placeholder="#1a1a1a or CSS" maxlength="80">
    </div>
    <button id="bgApplyBtn">Apply</button>
  </div>

  <!-- Add site modal (hidden by default) -->
  <div class="modal-backdrop" id="modal" style="display:none">
    <div class="modal" id="modalBox">
      <h2>Add site</h2>
      <label>URL</label>
      <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <label>Name</label>
      <input type="text" id="inputTitle" placeholder="Example" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancel</button>
        <button class="btn btn-primary" id="btnAdd">Add</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TILES = [
      { id: '1', url: 'https://www.google.com',        title: 'Google' },
      { id: '2', url: 'https://github.com',             title: 'GitHub' },
      { id: '3', url: 'https://developer.mozilla.org',  title: 'MDN' },
      { id: '4', url: 'https://stackoverflow.com',      title: 'Stack Overflow' },
      { id: '5', url: 'https://caniuse.com',            title: 'Can I Use' },
      { id: '6', url: 'https://regex101.com',           title: 'Regex 101' },
      { id: '7', url: 'https://jsonformatter.org',      title: 'JSON Formatter' },
      { id: '8', url: 'https://httpstatuses.io',        title: 'HTTP Status' },
    ];

    let tiles = [];

    function faviconSrc(url) {
      try {
        const host = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
      } catch { return ''; }
    }

    function makeFaviconEl(tile) {
      const src = faviconSrc(tile.url);
      if (!src) return makeInitialEl(tile);
      const img = document.createElement('img');
      img.className = 'tile-favicon';
      img.src = src;
      img.onerror = () => img.replaceWith(makeInitialEl(tile));
      return img;
    }

    function makeInitialEl(tile) {
      const el = document.createElement('div');
      el.className = 'tile-initial';
      el.textContent = (tile.title[0] || '?').toUpperCase();
      return el;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (const tile of tiles) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.title = tile.url;

        el.appendChild(makeFaviconEl(tile));

        const titleEl = document.createElement('div');
        titleEl.className = 'tile-title';
        titleEl.textContent = tile.title;
        el.appendChild(titleEl);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'tile-remove';
        removeBtn.title = 'Remove';
        removeBtn.textContent = '×';
        removeBtn.onclick = (e) => { e.stopPropagation(); removeTile(tile.id); };
        el.appendChild(removeBtn);

        el.onclick = () => { if (/^https?:\/\//i.test(tile.url)) window.location.href = tile.url; };
        grid.appendChild(el);
      }

      // Add tile
      const addEl = document.createElement('div');
      addEl.className = 'tile tile-add';
      const addIcon = document.createElement('span');
      addIcon.className = 'tile-add-icon';
      addIcon.textContent = '+';
      addEl.appendChild(addIcon);
      const addLabel = document.createElement('div');
      addLabel.className = 'tile-title';
      addLabel.textContent = 'Add site';
      addEl.appendChild(addLabel);
      addEl.onclick = () => openModal();
      grid.appendChild(addEl);
    }

    async function removeTile(id) {
      tiles = tiles.filter(t => t.id !== id);
      await persist();
      renderGrid();
    }

    async function addTile(url, title) {
      tiles.push({ id: String(Date.now()), url, title });
      await persist();
      renderGrid();
    }

    async function persist() {
      if (window.speedDial) await window.speedDial.saveTiles(tiles);
    }

    async function init() {
      if (window.speedDial) {
        try {
          const saved = await window.speedDial.getTiles();
          tiles = Array.isArray(saved) && saved.length > 0 ? saved : DEFAULT_TILES;
        } catch {
          tiles = DEFAULT_TILES;
        }
      } else {
        tiles = DEFAULT_TILES;
      }
      renderGrid();
    }

    // ── Modal ──
    function openModal() {
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputTitle').value = '';
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('inputUrl').focus();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function confirmAdd() {
      const url   = document.getElementById('inputUrl').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      if (!url) { document.getElementById('inputUrl').focus(); return; }
      let finalTitle = title;
      if (!finalTitle) {
        try { finalTitle = new URL(url).hostname.replace(/^www\./, ''); } catch { finalTitle = url; }
      }
      addTile(url, finalTitle);
      closeModal();
    }

    document.getElementById('btnCancel').onclick = closeModal;
    document.getElementById('btnAdd').onclick    = confirmAdd;

    document.getElementById('modal').onclick = (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    };

    document.getElementById('inputUrl').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        // Auto-fill title then move to title field
        const url = e.target.value.trim();
        if (url && !document.getElementById('inputTitle').value) {
          try { document.getElementById('inputTitle').value = new URL(url).hostname.replace(/^www\./, ''); } catch {}
        }
        document.getElementById('inputTitle').focus();
      }
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('inputTitle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  confirmAdd();
      if (e.key === 'Escape') closeModal();
    });

    init();

    // ── Background customization ──
    const BG_KEY = 'newtabBg';
    const BG_PRESETS = [
      { bg: '#1a1a1a', label: 'Dark' },
      { bg: '#0d1117', label: 'GitHub dark' },
      { bg: '#1e2a3a', label: 'Navy' },
      { bg: '#1a1a2e', label: 'Midnight' },
      { bg: '#f5f5f5', label: 'Light' },
      { bg: 'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)', label: 'Deep blue' },
      { bg: 'linear-gradient(135deg,#0d0d0d,#1a1a1a,#2d2d2d)', label: 'Charcoal' },
      { bg: 'linear-gradient(135deg,#1a2a1a,#0d1a0d)', label: 'Forest' },
    ];

    function applyBg(bg) {
      if (bg.startsWith('#') || bg.startsWith('rgb')) {
        document.body.style.background = bg;
      } else {
        document.body.style.background = bg;
      }
    }

    function renderPresets() {
      const savedBg = (() => { try { return localStorage.getItem(BG_KEY) || '#1a1a1a'; } catch { return '#1a1a1a'; } })();
      const container = document.getElementById('bgPresets');
      container.innerHTML = '';
      for (const p of BG_PRESETS) {
        const el = document.createElement('div');
        el.className = 'bg-preset' + (p.bg === savedBg ? ' active' : '');
        el.style.background = p.bg;
        el.title = p.label;
        el.addEventListener('click', () => {
          try { localStorage.setItem(BG_KEY, p.bg); } catch {}
          applyBg(p.bg);
          renderPresets();
          document.getElementById('bgColorInput').value = '';
        });
        container.appendChild(el);
      }
    }

    (() => {
      let savedBg;
      try { savedBg = localStorage.getItem(BG_KEY); } catch {}
      if (savedBg) applyBg(savedBg);

      renderPresets();

      const btn = document.getElementById('bgSettingsBtn');
      const panel = document.getElementById('bgPanel');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', () => { panel.style.display = 'none'; });
      panel.addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('bgApplyBtn').addEventListener('click', () => {
        const val = document.getElementById('bgColorInput').value.trim();
        if (!val) return;
        try { localStorage.setItem(BG_KEY, val); } catch {}
        applyBg(val);
        renderPresets();
      });
    })();

    (function initTheme() {
      const apply = (scheme) => document.body.classList.toggle('light-mode', scheme === 'light');
      if (!window.appTheme) return;
      window.appTheme.get().then(apply).catch(() => {});
      window.appTheme.onChange(apply);
    })();
  </script>
</body>
</html>
