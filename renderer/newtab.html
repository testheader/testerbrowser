<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #ddd;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 32px 48px;
      user-select: none;
      -webkit-user-select: none;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #3a3a3a;
      margin-bottom: 48px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 720px;
    }

    @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }

    /* ── Tile ── */
    .tile {
      position: relative;
      background: #252526;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      height: 130px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 12px 14px;
      transition: background 0.12s, box-shadow 0.12s, transform 0.1s, border-color 0.12s;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
    }
    .tile:hover {
      background: #2c2c2d;
      border-color: #3a3a3a;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      transform: translateY(-3px);
    }

    .tile-favicon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tile-initial {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #666;
      flex-shrink: 0;
    }

    .tile-title {
      font-size: 12px;
      color: #777;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      line-height: 1.2;
    }
    .tile:hover .tile-title { color: #999; }

    /* Remove button */
    .tile-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: #3a3a3a;
      color: #888;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s, background 0.1s, color 0.1s;
      padding: 0;
    }
    .tile:hover .tile-remove { opacity: 1; }
    .tile-remove:hover { background: #c0392b; color: #fff; }

    /* ── Add tile ── */
    .tile-add {
      border-style: dashed;
      border-color: #2e2e2e;
      background: transparent;
    }
    .tile-add:hover {
      border-color: #4fc3f7;
      background: rgba(79,195,247,0.04);
      box-shadow: none;
      transform: none;
    }
    .tile-add-icon {
      font-size: 26px;
      color: #3a3a3a;
      line-height: 1;
      transition: color 0.12s;
    }
    .tile-add:hover .tile-add-icon { color: #4fc3f7; }
    .tile-add .tile-title { color: #3a3a3a; }
    .tile-add:hover .tile-title { color: #4fc3f7; }

    /* ── Add modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      background: #252526;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 28px 30px 24px;
      width: 360px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .modal h2 {
      font-size: 14px;
      font-weight: 600;
      color: #eee;
      margin-bottom: 20px;
    }
    .modal label {
      display: block;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .modal input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3a3a3a;
      background: #1e1e1e;
      color: #ddd;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 14px;
      transition: border-color 0.12s;
    }
    .modal input:focus { outline: none; border-color: #4fc3f7; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .btn {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.1s;
    }
    .btn-primary { background: #4fc3f7; color: #000; font-weight: 500; }
    .btn-primary:hover { background: #81d4fa; }
    .btn-secondary { background: #2e2e2e; color: #aaa; }
    .btn-secondary:hover { background: #3a3a3a; }
  </style>
</head>
<body>
  <div class="wordmark">TesterBrowser</div>
  <div class="grid" id="grid"></div>

  <!-- Add site modal (hidden by default) -->
  <div class="modal-backdrop" id="modal" style="display:none">
    <div class="modal" id="modalBox">
      <h2>Add site</h2>
      <label>URL</label>
      <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      <label>Name</label>
      <input type="text" id="inputTitle" placeholder="Example" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancel</button>
        <button class="btn btn-primary" id="btnAdd">Add</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TILES = [
      { id: '1', url: 'https://www.google.com',        title: 'Google' },
      { id: '2', url: 'https://github.com',             title: 'GitHub' },
      { id: '3', url: 'https://developer.mozilla.org',  title: 'MDN' },
      { id: '4', url: 'https://stackoverflow.com',      title: 'Stack Overflow' },
      { id: '5', url: 'https://caniuse.com',            title: 'Can I Use' },
      { id: '6', url: 'https://regex101.com',           title: 'Regex 101' },
      { id: '7', url: 'https://jsonformatter.org',      title: 'JSON Formatter' },
      { id: '8', url: 'https://httpstatuses.io',        title: 'HTTP Status' },
    ];

    let tiles = [];

    function faviconSrc(url) {
      try {
        const host = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;
      } catch { return ''; }
    }

    function makeFaviconEl(tile) {
      const src = faviconSrc(tile.url);
      if (!src) return makeInitialEl(tile);
      const img = document.createElement('img');
      img.className = 'tile-favicon';
      img.src = src;
      img.onerror = () => img.replaceWith(makeInitialEl(tile));
      return img;
    }

    function makeInitialEl(tile) {
      const el = document.createElement('div');
      el.className = 'tile-initial';
      el.textContent = (tile.title[0] || '?').toUpperCase();
      return el;
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (const tile of tiles) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.title = tile.url;

        el.appendChild(makeFaviconEl(tile));

        const titleEl = document.createElement('div');
        titleEl.className = 'tile-title';
        titleEl.textContent = tile.title;
        el.appendChild(titleEl);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'tile-remove';
        removeBtn.title = 'Remove';
        removeBtn.textContent = '×';
        removeBtn.onclick = (e) => { e.stopPropagation(); removeTile(tile.id); };
        el.appendChild(removeBtn);

        el.onclick = () => { window.location.href = tile.url; };
        grid.appendChild(el);
      }

      // Add tile
      const addEl = document.createElement('div');
      addEl.className = 'tile tile-add';
      const addIcon = document.createElement('span');
      addIcon.className = 'tile-add-icon';
      addIcon.textContent = '+';
      addEl.appendChild(addIcon);
      const addLabel = document.createElement('div');
      addLabel.className = 'tile-title';
      addLabel.textContent = 'Add site';
      addEl.appendChild(addLabel);
      addEl.onclick = () => openModal();
      grid.appendChild(addEl);
    }

    async function removeTile(id) {
      tiles = tiles.filter(t => t.id !== id);
      await persist();
      renderGrid();
    }

    async function addTile(url, title) {
      tiles.push({ id: String(Date.now()), url, title });
      await persist();
      renderGrid();
    }

    async function persist() {
      if (window.speedDial) await window.speedDial.saveTiles(tiles);
    }

    async function init() {
      if (window.speedDial) {
        try {
          const saved = await window.speedDial.getTiles();
          tiles = Array.isArray(saved) && saved.length > 0 ? saved : DEFAULT_TILES;
        } catch {
          tiles = DEFAULT_TILES;
        }
      } else {
        tiles = DEFAULT_TILES;
      }
      renderGrid();
    }

    // ── Modal ──
    function openModal() {
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputTitle').value = '';
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('inputUrl').focus();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function confirmAdd() {
      const url   = document.getElementById('inputUrl').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      if (!url) { document.getElementById('inputUrl').focus(); return; }
      let finalTitle = title;
      if (!finalTitle) {
        try { finalTitle = new URL(url).hostname.replace(/^www\./, ''); } catch { finalTitle = url; }
      }
      addTile(url, finalTitle);
      closeModal();
    }

    document.getElementById('btnCancel').onclick = closeModal;
    document.getElementById('btnAdd').onclick    = confirmAdd;

    document.getElementById('modal').onclick = (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    };

    document.getElementById('inputUrl').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        // Auto-fill title then move to title field
        const url = e.target.value.trim();
        if (url && !document.getElementById('inputTitle').value) {
          try { document.getElementById('inputTitle').value = new URL(url).hostname.replace(/^www\./, ''); } catch {}
        }
        document.getElementById('inputTitle').focus();
      }
      if (e.key === 'Escape') closeModal();
    });

    document.getElementById('inputTitle').addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  confirmAdd();
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
