<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>TesterBrowser</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, sans-serif; background: #1e1e1e; color: #ddd; }

    /* ── Top bar ── */
    #topbar { display: flex; flex-direction: column; background: #252526; border-bottom: 1px solid #333; }

    /* Tabs */
    #tabs { display: flex; align-items: center; height: 40px; padding: 0 8px; gap: 4px; overflow-x: auto; }
    #tabs::-webkit-scrollbar { height: 3px; }
    #tabs::-webkit-scrollbar-thumb { background: #444; }
    .tab { display: flex; align-items: center; gap: 4px; padding: 5px 8px; background: #333;
           border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; white-space: nowrap;
           min-width: 0; max-width: 180px; user-select: none;
           border-left: 3px solid var(--tab-color, #555); position: relative; }
    .tab.active { background: #1e1e1e; border-bottom: 2px solid var(--tab-color, #4fc3f7); }
    .tab.dragging { opacity: 0.35; }
    .tab.drag-left  { box-shadow: -2px 0 0 0 var(--tab-color, #4fc3f7); }
    .tab.drag-right { box-shadow:  2px 0 0 0 var(--tab-color, #4fc3f7); }
    .tab-favicon { width: 14px; height: 14px; flex-shrink: 0; border-radius: 2px; }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .tab-dot.persistent { background: #4fc3f7; }
    .tab-dot.ephemeral  { background: #555; }
    .tab-pin { font-size: 10px; color: #e0c060; flex-shrink: 0; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none; flex: 1; min-width: 0; }
    .tab-close { flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center;
                 justify-content: center; border-radius: 3px; font-size: 13px; color: #777; }
    .tab-close:hover { background: #555; color: #fff; }
    .tab-rename-input { background: #111; color: #ddd; border: 1px solid #4fc3f7; border-radius: 2px;
                        font-size: 13px; padding: 1px 4px; width: 100px; outline: none; font-family: inherit; }
    #newSessionBtn { flex-shrink: 0; cursor: pointer; color: #4fc3f7; font-size: 18px; padding: 0 8px; user-select: none; }

    /* Loading spinner in tab (replaces favicon/dot while loading) */
    .tab-spinner { width: 12px; height: 12px; border: 2px solid #444;
                   border-top-color: var(--tab-color, #4fc3f7); border-radius: 50%;
                   animation: tab-spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes tab-spin { to { transform: rotate(360deg); } }

    /* Toolbar */
    #toolbar { height: 46px; display: flex; align-items: center; padding: 0 8px; gap: 6px; }
    .nav-btn { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer;
               padding: 4px 6px; border-radius: 4px; line-height: 1; flex-shrink: 0; }
    .nav-btn:hover:not(:disabled) { background: #333; color: #fff; }
    .nav-btn:disabled { color: #444; cursor: default; }
    #urlbar { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #444;
              background: #1e1e1e; color: #ddd; font-size: 14px; }
    #urlbar:focus { outline: none; border-color: #4fc3f7; }
    #zoomIndicator { font-size: 11px; color: #888; min-width: 36px; text-align: center;
                     display: none; cursor: pointer; padding: 2px 4px; border-radius: 3px;
                     flex-shrink: 0; }
    #zoomIndicator:hover { background: #333; color: #ddd; }
    #bookmarkBtn { background: none; border: none; color: #777; font-size: 17px; cursor: pointer;
                   padding: 3px 5px; border-radius: 4px; line-height: 1; flex-shrink: 0; }
    #bookmarkBtn:hover { color: #fff; background: #333; }
    #bookmarkBtn.bookmarked { color: #e5c07b; }
    #downloadsWrapper { position: relative; flex-shrink: 0; }
    #downloadsBtn { background: none; border: none; color: #aaa; font-size: 15px; cursor: pointer;
                    padding: 4px 6px; border-radius: 4px; line-height: 1; }
    #downloadsBtn:hover { background: #333; color: #fff; }
    #downloadsBadge { position: absolute; top: -2px; right: -2px; background: #e06c75;
                      color: #fff; font-size: 9px; border-radius: 50%; width: 14px; height: 14px;
                      display: none; align-items: center; justify-content: center; font-weight: bold; }

    /* Bookmarks bar */
    #bookmarksBar { height: 0; overflow: hidden; display: flex; align-items: center;
                    gap: 4px; background: #252526; border-top: 1px solid #333;
                    transition: height 0.15s ease; padding: 0; }
    #bookmarksBar.open { height: 32px; padding: 0 8px; overflow-x: auto; }
    #bookmarksBar::-webkit-scrollbar { height: 3px; }
    #bookmarksBar::-webkit-scrollbar-thumb { background: #444; }
    .bm-btn { background: none; border: 1px solid #3a3a3a; color: #bbb; border-radius: 3px;
              padding: 2px 6px 2px 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
              max-width: 160px; overflow: hidden; text-overflow: ellipsis; display: flex;
              align-items: center; gap: 4px; flex-shrink: 0; }
    .bm-btn:hover { background: #333; color: #fff; }
    .bm-remove { color: #555; font-size: 14px; line-height: 1; flex-shrink: 0; }
    .bm-remove:hover { color: #fff; }

    /* Find bar */
    #findBar { height: 40px; display: none; align-items: center; padding: 0 10px;
               gap: 6px; background: #1e1e1e; border-top: 1px solid #333; }
    #findBar.open { display: flex; }
    #findInput { padding: 4px 8px; border-radius: 4px; border: 1px solid #444;
                 background: #252526; color: #ddd; font-size: 13px; width: 220px; }
    #findInput:focus { outline: none; border-color: #4fc3f7; }
    #findInput.no-match { border-color: #e57373; background: #2a1a1a; }
    #findCount { font-size: 12px; color: #888; min-width: 60px; }
    .find-btn { background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
                padding: 3px 8px; cursor: pointer; font-size: 13px; }
    .find-btn:hover { background: #333; color: #fff; }

    /* Loading bar */
    #loadingBar { height: 3px; overflow: hidden; background: transparent; }
    #loadingBar.loading::after {
      content: ''; display: block; height: 100%; width: 30%;
      background: #4fc3f7;
      animation: loading-sweep 1.2s ease-in-out infinite;
    }
    @keyframes loading-sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* ── Permission notifications ── */
    #permissionNotifications { position: fixed; top: 88px; right: 12px; z-index: 60;
                               display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
    .perm-notif { background: #2d2d2d; border: 1px solid #555; border-radius: 6px;
                  padding: 10px 12px; display: flex; align-items: center; gap: 8px;
                  box-shadow: 0 4px 16px rgba(0,0,0,0.5); animation: perm-slide 0.2s ease; }
    @keyframes perm-slide { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
    .perm-msg { flex: 1; font-size: 12px; color: #ddd; line-height: 1.4; }
    .perm-btn { padding: 4px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    .perm-allow { background: #4fc3f7; color: #000; }
    .perm-allow:hover { background: #81d4fa; }
    .perm-block { background: #444; color: #ddd; }
    .perm-block:hover { background: #555; }

    /* ── Downloads panel ── */
    #downloadsPanel { position: fixed; top: 88px; right: 0; width: 320px; background: #252526;
                      border-left: 1px solid #444; border-bottom: 1px solid #444; z-index: 50;
                      transform: translateX(100%); transition: transform 0.2s ease;
                      display: flex; flex-direction: column; max-height: 420px; }
    #downloadsPanel.open { transform: none; }
    #downloadsPanelHeader { display: flex; align-items: center; padding: 8px 12px;
                            border-bottom: 1px solid #333; gap: 8px; flex-shrink: 0; }
    #downloadsPanelHeader span { flex: 1; font-size: 13px; font-weight: 600; color: #ddd; }
    .dl-hdr-btn { background: none; border: none; color: #777; cursor: pointer; font-size: 12px;
                  padding: 2px 6px; border-radius: 3px; }
    .dl-hdr-btn:hover { background: #333; color: #ddd; }
    #downloadsList { flex: 1; overflow-y: auto; padding: 4px 0; }
    .dl-empty { padding: 20px; text-align: center; color: #555; font-size: 13px; }
    .dl-item { padding: 8px 12px; border-bottom: 1px solid #2a2a2a; }
    .dl-item:last-child { border-bottom: none; }
    .dl-name { font-size: 12px; color: #ddd; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; margin-bottom: 4px; }
    .dl-progress { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin: 4px 0; }
    .dl-progress-bar { height: 100%; background: #4fc3f7; border-radius: 2px; transition: width 0.3s; }
    .dl-info { font-size: 11px; color: #777; margin-bottom: 4px; }
    .dl-info.ok  { color: #8fdc8f; }
    .dl-info.err { color: #ff8080; }
    .dl-actions { display: flex; gap: 6px; }
    .dl-btn { padding: 2px 8px; border-radius: 3px; border: 1px solid #444; background: none;
              color: #aaa; font-size: 11px; cursor: pointer; }
    .dl-btn:hover { background: #333; color: #fff; }
    .dl-btn-danger { border-color: #e57373; color: #e57373; }
    .dl-btn-danger:hover { background: #3a1a1a; }

    /* ── Console panel ── */
    #consolePanel { position: fixed; bottom: 0; left: 0; right: 0; height: 220px;
                    background: #181818; display: flex; flex-direction: column; z-index: 10; }
    #consoleDragHandle { height: 6px; min-height: 6px; background: #222; border-top: 1px solid #333;
                         cursor: ns-resize; flex-shrink: 0; }
    #consoleDragHandle:hover, #consoleDragHandle.dragging { background: #4fc3f7; }
    #consoleHeader { display: flex; align-items: center; gap: 6px; padding: 4px 10px;
                     background: #1e1e1e; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
    .console-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; flex-shrink: 0; }
    #filterText { flex: 1; min-width: 0; padding: 2px 6px; border-radius: 3px; border: 1px solid #333;
                  background: #252526; color: #ddd; font-size: 12px; }
    #filterText:focus { outline: none; border-color: #4fc3f7; }
    .filter-checks { display: flex; gap: 6px; flex-shrink: 0; }
    .filter-checks label { font-size: 11px; color: #777; display: flex; align-items: center; gap: 2px; cursor: pointer; }
    .filter-checks label:hover { color: #ddd; }
    #clearConsoleBtn { background: none; border: none; color: #555; cursor: pointer; font-size: 14px; padding: 0 4px; }
    #clearConsoleBtn:hover { color: #fff; }
    #exportHarBtn { background: none; border: 1px solid #3a3a3a; color: #666; cursor: pointer;
                    font-size: 11px; padding: 1px 6px; border-radius: 3px; }
    #exportHarBtn:hover { border-color: #4fc3f7; color: #4fc3f7; }
    .evt-overflow-msg { padding: 4px 10px; font-size: 11px; color: #555; font-style: italic;
                        border-bottom: 1px solid #2a2a2a; margin-bottom: 4px; }
    #timelinePanel { flex: 1; font-family: monospace; font-size: 12px; overflow-y: auto; padding: 4px 0; }
    .evt { padding: 1px 10px; cursor: pointer; white-space: pre-wrap; word-break: break-all; }
    .evt:hover { background: #222; }
    .evt-summary { }
    .evt-detail { background: #111; border-left: 2px solid #444; margin: 4px 10px 4px 0;
                  padding: 6px 8px; font-size: 11px; overflow-x: auto; white-space: pre; display: none; }
    .evt-detail.open { display: block; }
    .evt.network-request  .evt-summary { color: #7fc8ff; }
    .evt.network-response .evt-summary { color: #8fdc8f; }
    .evt.network-failed   .evt-summary { color: #ff8080; }
    .evt.console          .evt-summary { color: #e0c060; }
    .evt.log              .evt-summary { color: #b0b0b0; }

    /* ── Settings modal ── */
    #settingsOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
                       z-index: 100; align-items: center; justify-content: center; }
    #settingsOverlay.open { display: flex; }
    #settingsModal { background: #252526; border: 1px solid #444; border-radius: 8px;
                     width: 420px; min-width: 300px; min-height: 200px; padding: 28px 32px;
                     box-shadow: 0 8px 32px rgba(0,0,0,0.5); resize: both; overflow: auto; }
    #settingsModal h2 { margin: 0 0 24px; font-size: 16px; font-weight: 600; color: #fff; }
    .setting-row { display: flex; justify-content: space-between; align-items: center;
                   padding: 10px 0; border-bottom: 1px solid #333; font-size: 13px; }
    .setting-label { color: #999; }
    .setting-value { color: #ddd; font-family: monospace; }
    #updateStatusText { font-size: 13px; margin: 16px 0 20px; padding: 10px 12px; border-radius: 4px; background: #1e1e1e; }
    #updateStatusText.ok   { color: #8fdc8f; }
    #updateStatusText.info { color: #7fc8ff; }
    #updateStatusText.warn { color: #e0c060; }
    #updateStatusText.err  { color: #ff8080; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .btn { padding: 7px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; }
    .btn-primary   { background: #4fc3f7; color: #000; }
    .btn-primary:hover   { background: #81d4fa; }
    .btn-secondary { background: #333; color: #ddd; }
    .btn-secondary:hover { background: #444; }
    .btn-danger    { background: #e57373; color: #000; }
    .btn-danger:hover    { background: #ef9a9a; }

    /* ── Notes modal ── */
    #notesOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
                    z-index: 100; align-items: center; justify-content: center; }
    #notesOverlay.open { display: flex; }
    #notesModal { background: #252526; border: 1px solid #444; border-radius: 8px;
                  width: 500px; min-width: 300px; padding: 24px 28px;
                  box-shadow: 0 8px 32px rgba(0,0,0,0.5); resize: both; overflow: auto;
                  display: flex; flex-direction: column; }
    #notesModal h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: #fff; }
    #notesTextarea { flex: 1; min-height: 160px; background: #1e1e1e; color: #ddd; border: 1px solid #444;
                     border-radius: 4px; padding: 10px; font-family: inherit; font-size: 13px; resize: none; }
    #notesTextarea:focus { outline: none; border-color: #4fc3f7; }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="tabs"><span id="newSessionBtn" title="New tab (Ctrl+T)">+</span></div>
    <div id="toolbar">
      <button class="nav-btn" id="backBtn"   title="Back (Alt+←)"    disabled>&#8592;</button>
      <button class="nav-btn" id="fwdBtn"    title="Forward (Alt+→)"  disabled>&#8594;</button>
      <button class="nav-btn" id="reloadBtn" title="Reload (F5)">&#8635;</button>
      <input id="urlbar" placeholder="Enter URL and press Enter  (Ctrl+L)" list="urlHistoryList" autocomplete="off" />
      <datalist id="urlHistoryList"></datalist>
      <span id="zoomIndicator" title="Click to reset zoom (Ctrl+0)">100%</span>
      <button id="bookmarkBtn" title="Bookmark this page (Ctrl+D)">&#9734;</button>
      <div id="downloadsWrapper">
        <button id="downloadsBtn" title="Downloads">&#8595;</button>
        <span id="downloadsBadge"></span>
      </div>
      <button class="nav-btn" id="devtoolsBtn" title="DevTools (F12)">&#9881;</button>
    </div>
    <div id="bookmarksBar"></div>
    <div id="findBar">
      <input id="findInput" placeholder="Find in page…" />
      <span id="findCount"></span>
      <button class="find-btn" id="findPrevBtn" title="Previous (Shift+F3)">&#8593;</button>
      <button class="find-btn" id="findNextBtn" title="Next (F3)">&#8595;</button>
      <button class="find-btn" id="findCloseBtn">&#10005;</button>
    </div>
    <div id="loadingBar"></div>
  </div>

  <!-- Permission notifications (floating) -->
  <div id="permissionNotifications"></div>

  <!-- Downloads panel (slide-in from right) -->
  <div id="downloadsPanel">
    <div id="downloadsPanelHeader">
      <span>Downloads</span>
      <button class="dl-hdr-btn" id="clearDownloadsBtn" title="Clear completed">Clear</button>
      <button class="dl-hdr-btn" id="closeDownloadsBtn">&#10005;</button>
    </div>
    <div id="downloadsList"></div>
  </div>

  <div id="consolePanel">
    <div id="consoleDragHandle"></div>
    <div id="consoleHeader">
      <span class="console-label">Console</span>
      <input id="filterText" placeholder="Filter…" />
      <div class="filter-checks">
        <label><input type="checkbox" class="ftype" value="network-request"  checked> Req</label>
        <label><input type="checkbox" class="ftype" value="network-response" checked> Res</label>
        <label><input type="checkbox" class="ftype" value="network-failed"   checked> Err</label>
        <label><input type="checkbox" class="ftype" value="console"          checked> JS</label>
        <label><input type="checkbox" class="ftype" value="log"              checked> Log</label>
      </div>
      <button id="exportHarBtn" title="Export HAR file">HAR</button>
      <button id="clearConsoleBtn" title="Clear console">&#10005;</button>
    </div>
    <div id="timelinePanel"></div>
  </div>

  <!-- Settings -->
  <div id="settingsOverlay">
    <div id="settingsModal">
      <h2>About / Settings</h2>
      <div class="setting-row">
        <span class="setting-label">Current version</span>
        <span class="setting-value" id="currentVersion">—</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Latest version</span>
        <span class="setting-value" id="latestVersion">—</span>
      </div>
      <div id="updateStatusText" class="info">Checking for updates…</div>
      <div class="modal-actions">
        <button class="btn btn-danger"    id="restartBtn"     style="display:none">Restart to install</button>
        <button class="btn btn-secondary" id="checkUpdatesBtn">Check for updates</button>
        <button class="btn btn-primary"   id="closeSettingsBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Notes -->
  <div id="notesOverlay">
    <div id="notesModal">
      <h2 id="notesTitle">Notes</h2>
      <textarea id="notesTextarea" placeholder="Session notes…"></textarea>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn btn-secondary" id="closeNotesBtn">Close</button>
        <button class="btn btn-primary"   id="saveNotesBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
