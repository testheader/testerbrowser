name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Native modules not needed for type-checking — skip postinstall
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  bump-version:
    needs: [typecheck]
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Bump version and create GitHub release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if echo "$COMMIT_MSG" | grep -qiE "BREAKING CHANGE|^feat(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          npm version $BUMP --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"
          gh release create "v$VERSION" --prerelease --title "v$VERSION" --generate-notes

  build-windows:
    needs: [bump-version]
    if: "always() && needs.bump-version.result != 'failure'"
    # Pin to windows-2022 — windows-latest uses VS 2025 Preview which node-gyp can't detect
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Skip postinstall (would compile better-sqlite3 against Node instead of Electron)
      - run: npm ci --ignore-scripts
      # Rebuild better-sqlite3 against Electron's ABI
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      # electron-builder names the file "TesterBrowser Setup X.Y.Z.exe" (spaces).
      # Rename to hyphenated form and generate latest.yml (not produced by --publish never).
      - name: Rename artifacts and generate latest.yml
        shell: node {0}
        run: |
          const crypto = require('crypto');
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const src = `release/TesterBrowser Setup ${v}.exe`;
          const dst = `release/TesterBrowser-Setup-${v}.exe`;
          fs.renameSync(src, dst);
          fs.renameSync(`${src}.blockmap`, `${dst}.blockmap`);
          const buf = fs.readFileSync(dst);
          const sha512 = crypto.createHash('sha512').update(buf).digest('base64');
          const size = buf.length;
          const date = new Date().toISOString();
          const yml = [
            `version: ${v}`,
            `files:`,
            `  - url: TesterBrowser-Setup-${v}.exe`,
            `    sha512: ${sha512}`,
            `    size: ${size}`,
            `path: TesterBrowser-Setup-${v}.exe`,
            `sha512: ${sha512}`,
            `releaseDate: '${date}'`,
            ''
          ].join('\n');
          fs.writeFileSync('release/latest.yml', yml);
          console.log(`Generated release/latest.yml for v${v}`);
      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" \
            "release/TesterBrowser-Setup-${VERSION}.exe" \
            "release/TesterBrowser-Setup-${VERSION}.exe.blockmap" \
            release/latest.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TesterBrowser-windows-installer
          path: release/TesterBrowser-Setup-*.exe

  build-linux:
    needs: [bump-version, build-windows]
    if: "always() && needs.bump-version.result != 'failure' && needs.build-windows.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npm run build
      - run: npx electron-builder --linux appimage --publish never
      # Generate latest-linux.yml (not produced by --publish never)
      - name: Generate latest-linux.yml
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE=$(ls release/TesterBrowser-*.AppImage | head -1)
          FNAME=$(basename "$APPIMAGE")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMAGE" | base64 -w 0)
          SIZE=$(wc -c < "$APPIMAGE" | tr -d ' ')
          DATE=$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')
          printf "version: %s\nfiles:\n  - url: %s\n    sha512: %s\n    size: %s\npath: %s\nsha512: %s\nreleaseDate: '%s'\n" \
            "$VERSION" "$FNAME" "$SHA512" "$SIZE" "$FNAME" "$SHA512" "$DATE" \
            > release/latest-linux.yml
          echo "Generated release/latest-linux.yml for v$VERSION"
      - name: Upload assets to GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" \
            release/TesterBrowser-*.AppImage \
            release/latest-linux.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TesterBrowser-linux-appimage
          path: release/*.AppImage
