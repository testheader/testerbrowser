name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  bump-version:
    needs: [typecheck]
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -qiE "BREAKING CHANGE|^feat(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          npm version $BUMP --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git push

  build-windows:
    needs: [bump-version]
    if: "always() && needs.bump-version.result != 'failure'"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TesterBrowser-windows-installer
          path: release/*.exe

  build-linux:
    needs: [bump-version, build-windows]
    if: "always() && needs.bump-version.result != 'failure' && needs.build-windows.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: TesterBrowser-linux-appimage
          path: release/*.AppImage
