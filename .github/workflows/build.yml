name: Build

on:
  push:
  workflow_dispatch:

jobs:
  typecheck:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Native modules not needed for type-checking or unit tests — skip postinstall.
      # better-sqlite3 is mocked in Jest, so no native compilation is required.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  lint:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  unit-test:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

  bump-version:
    needs: [typecheck, lint, unit-test]
    if: "github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bump version and create draft GitHub release
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if echo "$COMMIT_MSG" | grep -qiE "BREAKING CHANGE|^feat(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          npm version $BUMP --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git pull --rebase origin main
          git push
          git push origin "v$VERSION"
          gh release create "v$VERSION" --draft --title "v$VERSION" --generate-notes
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [bump-version]
    if: "always() && needs.bump-version.result != 'failure'"
    # Pin to windows-2022 — windows-latest uses VS 2025 Preview which node-gyp can't detect
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # electron-rebuild needs a real Electron binary (to rebuild native modules
      # against its ABI) — under --ignore-scripts that's a lazy download the
      # first time node_modules/electron is required, cached by @electron/get
      # at its own default path (env-paths' Windows cache dir), not npm's cache.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Skip postinstall (would compile better-sqlite3 against Node instead of Electron)
      - run: npm ci --ignore-scripts
      # Rebuild better-sqlite3 against Electron's ABI
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npm run build
      - name: Build Windows installer
        shell: bash
        run: |
          # Only export signing env vars when the secret is present — an empty
          # WIN_CSC_LINK causes electron-builder to fail attempting to sign.
          if [ -n "$WIN_CSC_LINK_VAL" ]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_VAL"
            export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_VAL"
          fi
          npx electron-builder --win nsis --publish never
        env:
          WIN_CSC_LINK_VAL: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_VAL: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # electron-builder names the file "TesterBrowser Setup X.Y.Z.exe" (spaces).
      # Rename to hyphenated form and generate latest.yml (not produced by --publish never).
      - name: Rename artifacts and generate latest.yml
        shell: node {0}
        run: |
          const crypto = require('crypto');
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const src = `release/TesterBrowser Setup ${v}.exe`;
          const dst = `release/TesterBrowser-Setup-${v}.exe`;
          fs.renameSync(src, dst);
          fs.renameSync(`${src}.blockmap`, `${dst}.blockmap`);
          const buf = fs.readFileSync(dst);
          const sha512 = crypto.createHash('sha512').update(buf).digest('base64');
          const size = buf.length;
          const date = new Date().toISOString();
          const yml = [
            `version: ${v}`,
            `files:`,
            `  - url: TesterBrowser-Setup-${v}.exe`,
            `    sha512: ${sha512}`,
            `    size: ${size}`,
            `path: TesterBrowser-Setup-${v}.exe`,
            `sha512: ${sha512}`,
            `releaseDate: '${date}'`,
            ''
          ].join('\n');
          fs.writeFileSync('release/latest.yml', yml);
          console.log(`Generated release/latest.yml for v${v}`);
      - name: Upload assets to GitHub Release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" \
            "release/TesterBrowser-Setup-${VERSION}.exe" \
            "release/TesterBrowser-Setup-${VERSION}.exe.blockmap" \
            release/latest.yml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: TesterBrowser-windows-installer
          path: release/TesterBrowser-Setup-*.exe

  e2e:
    # No longer needs bump-version — that commit only touches package.json/
    # package-lock.json's version, which no e2e spec reads (grep -n version
    # e2e/*.spec.ts is empty), so waiting for it just delays the start for
    # nothing. Checks out this push's own commit directly instead.
    if: "github.actor != 'github-actions[bot]'"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # See build-windows's identical step above for why this path/why it's
      # not npm's own cache.
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report and results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish-release:
    needs: [bump-version, build-windows, e2e]
    if: "needs.bump-version.result == 'success' && needs.build-windows.result == 'success' && needs.e2e.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote draft release to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: gh release edit "v$VERSION" --prerelease --draft=false --repo testheader/testerbrowser
